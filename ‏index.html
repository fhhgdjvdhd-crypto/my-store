<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجري المصغر | أحمد عوض</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- رأس الصفحة -->
    <header class="store-header">
        <h1>متجر أحمد عوض الرقمي</h1>
        <p>أفضل المنتجات والخدمات الحصرية بأسعار تنافسية</p>
    </header>

    <!-- قسم المنتجات -->
    <main class="products-container">
        
        <!-- منتج 1 -->
        <div class="product-card">
            <div class="product-img">📦</div>
            <h3>المنتج الاحترافي الأول</h3>
            <p class="desc">وصف مختصر للمنتج يوضح مميزاته وفوائده للعميل.</p>
            <span class="price">299 ج.م</span>
            <button class="buy-btn" onclick="orderProduct('المنتج الاحترافي الأول')">اطلب الآن</button>
        </div>

        <!-- منتج 2 -->
        <div class="product-card">
            <div class="product-img">🚀</div>
            <h3>الخدمة الرقمية الثانية</h3>
            <p class="desc">وصف مختصر للخدمة وكيف تساعد العميل في مشروعه.</p>
            <span class="price">499 ج.م</span>
            <button class="buy-btn" onclick="orderProduct('الخدمة الرقمية الثانية')">اطلب الآن</button>
        </div>

    </main>

    <!-- تذييل الصفحة -->
    <footer>
        <p>جميع الحقوق محفوظة &copy; 2026 - أحمد عوض</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
